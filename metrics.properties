# Enables Spark's built-in Prometheus sink (Spark 3.x)
# Mounted into the spark container at /opt/spark/conf/metrics.properties
# Must be referenced explicitly on spark-submit with:
#   --conf spark.metrics.conf=/opt/spark/conf/metrics.properties

*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

# Streaming query metrics (numInputRows, processingRate, batchDuration, etc.)
*.source.streaming.class=org.apache.spark.sql.streaming.metrics.StreamingQuerySource
