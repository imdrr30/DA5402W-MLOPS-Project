<div class="container animate-fade-in" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-panel" style="width: 100%; max-width: 450px; padding: 40px; border-radius: var(--border-radius-md); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
    <h2 class="glow-text" style="font-size: 26px; font-weight: 700; margin-bottom: 8px; text-align: center;">
      Welcome Back
    </h2>
    <p style="color: var(--text-secondary); text-align: center; font-size: 14px; margin-bottom: 30px;">
      Sign in to access your e-commerce recommendations dashboard
    </p>

    <div *ngIf="errorMsg()" class="glass-card" style="padding: 12px 16px; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); color: #f87171; font-size: 14px; margin-bottom: 20px; border-radius: var(--border-radius-sm);">
      {{ errorMsg() }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" [(ngModel)]="email" class="form-input" placeholder="john.doe@example.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label">Password</label>
        <input type="password" name="password" [(ngModel)]="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading()" style="width: 100%; justify-content: center; height: 48px;">
        <span *ngIf="!loading()">Sign In</span>
        <span *ngIf="loading()">Authenticating...</span>
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-secondary);">
      New to the system? 
      <a routerLink="/register" class="nav-link" style="display: inline; color: var(--accent-primary); font-weight: 600;">Create Account</a>
    </div>
  </div>
</div>
