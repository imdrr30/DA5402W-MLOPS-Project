<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apriori Product Recommender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f9fafb;
      color: #111827;
    }
    h1 {
      margin-bottom: 8px;
      color: #1f2937;
    }
    .section {
      margin-bottom: 24px;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    .product-card {
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      text-align: center;
      background: #f3f4f6;
    }
    .product-card button {
      margin-top: 10px;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    .product-card button:hover {
      background: #1d4ed8;
    }
    .product-card button:disabled {
      background: #9ca3af;
      cursor: default;
    }
    .cart-list,
    .recommendations-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .cart-list li,
    .recommendations-list li {
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #fef3c7;
      border: 1px solid #fde68a;
    }
  </style>
</head>
<body>
  <h1>Apriori Product Recommender</h1>
  <div class="section">
    <p>
      Click the product IDs below to build a cart. When items are added, the page calls the recommendation endpoint and shows related items.
    </p>
    <p>
      <strong>Note:</strong> This page expects a running API at <code>http://127.0.0.1:8000/predict</code>.
    </p>
  </div>

  <div class="section">
    <h2>Available products</h2>
    <div class="product-grid" id="product-grid"></div>
  </div>

  <div class="section">
    <h2>Shopping cart</h2>
    <ul class="cart-list" id="cart-items"></ul>
    <button id="clear-cart">Clear cart</button>
  </div>

  <div class="section">
    <h2>Customers also bought</h2>
    <ul class="recommendations-list" id="recommendations"></ul>
    <div class="status" id="status" style="display:none"></div>
  </div>

  <script>
    const apiUrl = "http://127.0.0.1:8000/predict";
    const products = [
      "77",
      "89",
      "124",
      "71",
      "92",
      "14",
      "241",
      "226",
      "228",
      "36",
      "271",
      "132",
      "13",
    ];
    const cart = [];

    const productGrid = document.getElementById("product-grid");
    const cartItems = document.getElementById("cart-items");
    const recommendations = document.getElementById("recommendations");
    const status = document.getElementById("status");
    const clearCartBtn = document.getElementById("clear-cart");

    function renderProducts() {
      productGrid.innerHTML = "";
      products.forEach((productId) => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div><strong>Product ${productId}</strong></div>
          <button data-product="${productId}">Add to cart</button>
        `;

        const button = card.querySelector("button");
        button.addEventListener("click", () => addToCart(productId));
        if (cart.includes(productId)) {
          button.textContent = "Added";
          button.disabled = true;
        }
        productGrid.appendChild(card);
      });
    }

    function renderCart() {
      cartItems.innerHTML = "";
      if (cart.length === 0) {
        cartItems.innerHTML = "<li>Your cart is empty.</li>";
        return;
      }
      cart.forEach((productId) => {
        const item = document.createElement("li");
        item.textContent = `Product ${productId}`;
        cartItems.appendChild(item);
      });
    }

    function renderRecommendations(items) {
      recommendations.innerHTML = "";
      if (!items || items.length === 0) {
        recommendations.innerHTML = "<li>No recommendations returned yet.</li>";
        return;
      }

      items.forEach((row) => {
        const item = document.createElement("li");
        if (Array.isArray(row)) {
          item.textContent = row.length ? row.join(", ") : "No recommendations";
        } else if (typeof row === "string") {
          item.textContent = row;
        } else {
          item.textContent = JSON.stringify(row);
        }
        recommendations.appendChild(item);
      });
    }

    async function fetchRecommendations() {
      if (cart.length === 0) {
        status.style.display = "block";
        status.textContent = "Add products to the cart first to get recommendations.";
        renderRecommendations([]);
        return;
      }

      status.style.display = "block";
      status.textContent = "Fetching recommendations...";

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ items: cart }),
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();
        if (result.predicted_items) {
          renderRecommendations(result.predicted_items);
          status.textContent = "Recommendations updated.";
        } else {
          renderRecommendations([]);
          status.textContent = "No predicted_items field found in response.";
        }
      } catch (error) {
        renderRecommendations([]);
        status.textContent = `Error fetching recommendations: ${error.message}`;
      }
    }

    function addToCart(productId) {
      if (!cart.includes(productId)) {
        cart.push(productId);
        renderCart();
        renderProducts();
        fetchRecommendations();
      }
    }

    clearCartBtn.addEventListener("click", () => {
      cart.length = 0;
      renderCart();
      renderProducts();
      renderRecommendations([]);
      status.style.display = "block";
      status.textContent = "Cart cleared.";
    });

    renderProducts();
    renderCart();
    renderRecommendations([]);
  </script>
</body>
</html>
