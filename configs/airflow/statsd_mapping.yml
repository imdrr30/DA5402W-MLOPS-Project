---
# Statsd exporter mapping for Airflow metrics
# Converts Airflow's StatsD-format metrics into Prometheus-format metrics
mappings:
  # DAG run duration
  - match: "airflow.dagrun.duration.*.*"
    name: "airflow_dagrun_duration_seconds"
    labels:
      dag_id: "$1"
      status: "$2"

  # DAG processing parse time
  - match: "airflow.dag_processing.total_parse_time"
    name: "airflow_dag_processing_total_parse_time_seconds"

  # Scheduler heartbeat
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat_total"

  # Scheduler tasks running
  - match: "airflow.scheduler.tasks.running"
    name: "airflow_scheduler_tasks_running"

  # Scheduler tasks starving
  - match: "airflow.scheduler.tasks.starving"
    name: "airflow_scheduler_tasks_starving"

  # Task instance start
  - match: "airflow.ti.start.*.*"
    name: "airflow_ti_start_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  # Task instance finish (with state)
  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_ti_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  # Operator successes
  - match: "airflow.operator_successes_*"
    name: "airflow_operator_successes_total"
    labels:
      operator: "$1"

  # Operator failures
  - match: "airflow.operator_failures_*"
    name: "airflow_operator_failures_total"
    labels:
      operator: "$1"

  # Executor slots
  - match: "airflow.executor.open_slots"
    name: "airflow_executor_open_slots"

  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"

  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"

  # Pool task slots
  - match: "airflow.pool.open_slots.*"
    name: "airflow_pool_open_slots"
    labels:
      pool: "$1"

  - match: "airflow.pool.used_slots.*"
    name: "airflow_pool_used_slots"
    labels:
      pool: "$1"

  # Drop anything else to avoid cardinality explosion
  - match: "."
    match_type: regex
    action: drop
    name: "dropped"
